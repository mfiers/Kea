# Node types and typed relations of the documentation tree (doc/<project>/<type>/<id>.md).
# The (future) site builder validates every page against this file. Decided 2026-11-04 (see doc/site_design.md).
#
# Every page: YAML front matter with id, type, title, short, parent (except a project's home goal), status
# (where listed), relations (below), sources (code / data paths, optional). Links in text: [[id]],
# [[id|text]], [[project:id]] across projects, [[code:path#symbol]], [[data:path]].

number_prefix:          # numbering per project, in order of `order:` then file name
  premise: P
  question: Q
  hypothesis: H
  step: S
  result: R
  conclusion: C
  decision: D
  figure: F
  artefact: A
  caveat: W          # W for warning; added 2026-11-05 (cycle 1, item 15)

status_values:
  goal: [open, in_progress, done]
  premise: [assumed, supported, questioned]
  question: [open, answered, dropped]
  hypothesis: [planned, supported, not_supported, inconclusive]
  step: [planned, in_progress, done, dropped]
  result: [done, exploratory, deprecated]       # exploratory: test designed after seeing earlier results
  conclusion: [exploratory, supported, not_supported, deprecated]
  decision: [active, superseded]
  figure: [done, deprecated]
  artefact: [current, deprecated]
  caveat: [open, addressed]     # open: limits the claims it points to; addressed: a later step dealt with it

# relation: allowed source types -> allowed target types. Reverse edges are generated by the builder.
relations:
  answers:        {from: [result, conclusion], to: [question]}
  tests:          {from: [step, result], to: [hypothesis]}
  supports:       {from: [result, figure, reference, conclusion], to: [hypothesis, conclusion, premise]}
  opposes:        {from: [result, figure, reference, conclusion], to: [hypothesis, conclusion, premise]}
  supported_by:   {from: [conclusion, hypothesis, premise], to: [result, figure, reference, conclusion]}   # same edge as supports, written on the claim side
  opposed_by:     {from: [conclusion, hypothesis, premise], to: [result, figure, reference, conclusion]}
  relies_on:      {from: [any], to: [any]}
  shown_in:       {from: [result], to: [figure]}
  made_by:        {from: [result, figure, artefact], to: [step]}
  from_artefact:  {from: [result, figure], to: [artefact]}
  derived_from:   {from: [artefact], to: [artefact]}
  decided_in:     {from: [step, result], to: [decision]}
  supersedes:     {from: [any], to: [any]}
  limits:         {from: [caveat], to: [any]}                 # a caveat limits a result, conclusion, premise, ...
  addressed_by:   {from: [caveat], to: [step, result, decision, conclusion]}
  cites:          {from: [any], to: [reference]}

# Terms (type term) may list `aliases:`; the first use of the title or an alias on every page of the same
# experiment links to the term page automatically (not inside links, code, headings or tables of numbers).

required:
  conclusion: [relations.supports_or_opposes_from_results]   # a conclusion needs at least one result behind it
  result: [sources]                                            # every number comes from a file
  artefact: [path, format, made_by]
  hypothesis: [fixed_before_results]                           # true / false: stated before the results were seen
  caveat: [relations.limits]                                   # a caveat says what it limits
